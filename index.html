<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <script>try{var t=localStorage.getItem("conti-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <title>Ledger</title>
  <link rel="stylesheet" href="shared/styles.css">
  <link rel="stylesheet" href="cockpit.css">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Caricamento -->
  <main id="view-loading" class="center" role="status" aria-live="polite">
    <span class="visually-hidden">Caricamento…</span>
    <div class="skel cp-skel" aria-hidden="true"></div>
  </main>

  <!-- Login -->
  <main id="view-login" class="center" hidden>
    <form id="form-login" class="card auth" autocomplete="on" aria-label="Accesso">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="username" required>
      <label for="login-pass">Password</label>
      <input id="login-pass" type="password" autocomplete="current-password" required>
      <p id="login-msg" class="msg" role="alert"></p>
      <button class="btn primary" type="submit">Accedi</button>
    </form>
  </main>

  <!-- Nuova password (dopo il link ricevuto via email) -->
  <main id="view-recovery" class="center" hidden>
    <form id="form-recovery" class="card auth">
      <h1>Nuova password</h1>
      <label for="rec-pass">Nuova password (min. 8 caratteri)</label>
      <input id="rec-pass" type="password" autocomplete="new-password" minlength="8" required>
      <p id="rec-msg" class="msg" role="alert"></p>
      <button class="btn primary" type="submit">Salva password</button>
    </form>
  </main>

  <!-- Cockpit: scelta del servizio -->
  <div id="view-cockpit" class="wrap" hidden>
    <header class="top">
      <div>
        <h1>Ledger</h1>
        <p class="subtitle">Scegli un servizio</p>
      </div>
      <div class="top-actions">
        <button class="btn icon" id="btn-theme" type="button" aria-label="Cambia tema chiaro/scuro" title="Cambia tema chiaro/scuro">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="btn" id="btn-logout" type="button">Esci</button>
      </div>
    </header>

    <nav class="services" aria-label="Servizi">
      <a class="card service" href="budget/" id="svc-budget">
        <span class="svc-ico svc-budget" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><path d="M7 15h3"/></svg></span>
        <span class="svc-txt"><strong>Budget</strong><small>Conti, spese, ricorrenze e simulazioni</small></span>
        <span class="svc-go" aria-hidden="true">›</span>
      </a>
      <a class="card service" href="planning/" id="svc-planning">
        <span class="svc-ico svc-planning" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
        <span class="svc-txt"><strong>Planning</strong><small>Calendario di ferie e permessi</small></span>
        <span class="svc-go" aria-hidden="true">›</span>
      </a>
      </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="shared/config.js"></script>
  <script src="shared/theme.js"></script>
  <script src="cockpit.js"></script>
</body>
</html>
